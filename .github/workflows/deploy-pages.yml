# Publishes the website to GitHub Pages every time main changes.
# One-time setup in GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until that is switched on, this workflow skips the deploy and leaves a warning instead of failing.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check that GitHub Pages is switched on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not switched on yet. Go to Settings > Pages, set Source to GitHub Actions, then run this workflow again."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the pages from _build (so edits to content.py go live even if the HTML wasn't rebuilt)
        run: |
          python3 _build/build.py
          if ! git diff --quiet; then
            echo "::notice::The committed HTML was out of date, so the freshly built pages were published."
          fi

      - name: Collect the public files
        run: |
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_build' --exclude='./_site' \
              --exclude='./README.md' --exclude='./.gitignore' -cf - . | tar -xf - -C _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
